apiVersion: v1
kind: Namespace
metadata:
  name: agentrun-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentrun-controller
  labels:
    app.kubernetes.io/name: agentrun-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentrun-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentrun-operator
    spec:
      serviceAccountName: agentrun-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: agentrun-controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: AGENT_IMAGE
              value: agentrun-agent:dev
            - name: AGENT_IMAGE_PULL_POLICY
              value: IfNotPresent
            - name: MOCK_SPEED
              value: "1"
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agentrun-metrics
  labels:
    app.kubernetes.io/name: agentrun-operator
spec:
  selector:
    app.kubernetes.io/name: agentrun-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
