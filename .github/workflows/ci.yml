name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: make manifests && git diff --exit-code -- api config
        name: generated code is up to date
      - run: make lint
      - run: make test
      - run: make images
